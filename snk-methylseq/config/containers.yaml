# Singularity images used by each rule. Paths are relative to snk-methylseq/ (or absolute).
# Each is the image the matching nf-core/methylseq 4.2.0 module pins
# (modules/nf-core/*/main.nf, https singularity URL), downloaded into containers/
# under the file name Nextflow gives it in NXF_SINGULARITY_CACHEDIR.
# Not listed: PARABRICKS_FQ2BAMMETH (GPU only, not ported) and
# QUALIMAP_BAMQCCRAM (never called by the pipeline).
containers:
  # BISMARK_GENOMEPREPARATION, BISMARK_ALIGN, BISMARK_DEDUPLICATE,
  # BISMARK_METHYLATIONEXTRACTOR, BISMARK_COVERAGE2CYTOSINE, BISMARK_REPORT, BISMARK_SUMMARY
