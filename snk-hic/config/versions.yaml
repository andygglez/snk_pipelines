  - merge_pairstats
  - merge_rsstats
MERGE_VALID_INTERACTION:
  module: MERGE_VALID_INTERACTION
  style: file
  tools:
  - - sort
    - echo $(sort --version 2>&1 | head -1 | awk '{print $NF}' 2>&1)
  rules:
  - merge_valid_interaction
MULTIQC:
  module: MULTIQC
  style: file
  tools:
  - - multiqc
    - ' multiqc --version | sed -e "s/multiqc, version //g" '
  rules:
