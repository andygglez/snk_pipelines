SPLIT_COOLER_DUMP:
  module: SPLIT_COOLER_DUMP
  style: file
  tools:
  - - cooler
    - awk --version | head -1 | cut -f1 -d, | sed -e 's/GNU Awk //'
  rules:
  - split_cooler_dump
TRIM_READS:
  module: TRIM_READS
  style: file
  tools:
  - - gzip
    - echo $(gzip --version 2>&1) | head -1 | cut -d" " -f2
  rules:
  - trim_reads
# Not listed: SAMPLESHEET_CHECK runs, but nf-core/hic 2.1.0's INPUT_CHECK emits no
# versions channel, so it is absent from software_versions.yml.
