# Minimal test profile — mirrors nf-core/atacseq 2.1.2 conf/test_controls.config (with_control stays false, as in nf-core).
# Offline copy for Rorqual compute nodes (pre-downloaded test data in /scratch/andygg98/claude_jobs/chipseq_testdata/).
# Usage: snakemake --cores 2 --sdm apptainer --configfile config/test_controls.yaml
input: "config/samplesheet_controls_local.csv"
outdir: "results_test_controls"
workdir: "work_test_controls"
read_length: 50
mito_name: "MT"
fasta: "/scratch/andygg98/claude_jobs/chipseq_testdata/genome.fa"
gtf: "/scratch/andygg98/claude_jobs/chipseq_testdata/genes.gtf"
fingerprint_bins: 100

# test profile: max_cpus 2, max_memory 6.GB
resources:
  process_default: {threads: 1, mem_mb: 6144}
  process_single:  {threads: 1, mem_mb: 6144}
  process_low:     {threads: 2, mem_mb: 6144}
  process_medium:  {threads: 2, mem_mb: 6144}
  process_high:    {threads: 2, mem_mb: 6144}
