# Minimal test profile — mirrors nf-core/atacseq 2.1.2 conf/test_controls.config run with --with_control (extra scenario).
# Usage: snakemake --cores 2 --sdm apptainer --configfile config/test_with_control.yaml
input: "config/samplesheet_controls.csv"
outdir: "results_with_control"
workdir: "work_with_control"
with_control: true
read_length: 50
mito_name: "MT"
fasta: "https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genome.fa"
gtf: "https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genes.gtf"
fingerprint_bins: 100

# test profile: max_cpus 2, max_memory 6.GB
resources:
  process_default: {threads: 1, mem_mb: 6144}
  process_single:  {threads: 1, mem_mb: 6144}
  process_low:     {threads: 2, mem_mb: 6144}
  process_medium:  {threads: 2, mem_mb: 6144}
  process_high:    {threads: 2, mem_mb: 6144}
