# Singularity images used by each rule. Paths are relative to snk-atacseq/ (or absolute).
# Each is the image the matching nf-core/atacseq 2.1.2 module pins
# (modules/*/main.nf, https singularity URL), downloaded into containers/.
# Not listed: UMITOOLS_EXTRACT (atacseq never runs UMI extraction).
containers:
  # CUSTOM_DUMPSOFTWAREVERSIONS (its python/yaml versions; the rule itself runs on the host)
  dumpsoftwareversions: containers/depot.galaxyproject.org-singularity-multiqc-1.14--pyhdfd78af_0.img
  # SAMPLESHEET_CHECK, GET_AUTOSOMES, IGV
  python: containers/depot.galaxyproject.org-singularity-python-3.8.3.img
  # GUNZIP_*, UNTAR_*, TSS_EXTRACT, MULTIQC_CUSTOM_PEAKS
  ubuntu20: containers/depot.galaxyproject.org-singularity-ubuntu-20.04.img
  # GFFREAD
  gffread: containers/depot.galaxyproject.org-singularity-gffread-0.12.1--h8b12597_0.img
  # GTF2BED
  perl: containers/depot.galaxyproject.org-singularity-perl-5.26.2.img
  # CUSTOM_GETCHROMSIZES
  getchromsizes: containers/depot.galaxyproject.org-singularity-samtools-1.16.1--h6899075_1.img
  # SAMTOOLS_SORT/INDEX/STATS/FLAGSTAT/IDXSTATS
  samtools: containers/depot.galaxyproject.org-singularity-samtools-1.17--h00cdaf9_0.img
  # GENOME_BLACKLIST_REGIONS, BEDTOOLS_GENOMECOV
  bedtools: containers/depot.galaxyproject.org-singularity-bedtools-2.30.0--hc088bd4_0.img
  # BWA_INDEX
  bwa_index: containers/depot.galaxyproject.org-singularity-bwa-0.7.17--hed695b0_7.img
  # BWA_MEM (bwa + samtools)
