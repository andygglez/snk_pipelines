  tools:
  - - gffread
    - gffread --version 2>&1
  rules:
  - gffread
GTF2BED:
  module: GTF2BED
  style: file
  tools:
  - - perl
    - echo $(perl --version 2>&1) | sed 's/.*v\(.*\)) built.*/\1/'
