  - gunzip
  when: not param("gtf") and str(param("gff")).endswith(".gz")
GUNZIP_GTF:
  module: GUNZIP
  style: file
  tools:
  - - gunzip
    - echo $(gunzip --version 2>&1) | sed 's/^.*(gzip) //; s/ Copyright.*$//'
  rules:
  - gunzip
  when: str(param("gtf")).endswith(".gz")
