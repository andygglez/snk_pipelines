# nf-core process -> port rules (regexes), optional `when` (Python, Snakefile names + any_wc()),
# module version-reporting style (file = versions.yml, topic = topic channel) and the
# version commands of its nf-core module. Generated from the pinned nf-core sources;
# read by the software_versions rule.
ANNOTATE_BOOLEAN_PEAKS:
  module: ANNOTATE_BOOLEAN_PEAKS
  style: file
  tools:
  - - sed
    - echo $(sed --version 2>&1) | sed 's/^.*GNU sed) //; s/ .*$//'
  rules:
  - annotate_boolean_peaks
BAMTOOLS_FILTER:
  module: BAMTOOLS_FILTER
  style: file
  tools:
  - - samtools
    - echo $(samtools --version 2>&1) | sed 's/^.*samtools //; s/Using.*$//'
  - - bamtools
    - echo $(bamtools --version 2>&1) | sed 's/^.*bamtools //; s/Part .*$//'
  rules:
  - bamtools_filter_pe
  - bamtools_filter_se
BAM_REMOVE_ORPHANS:
  module: BAM_REMOVE_ORPHANS
  style: file
  tools:
  - - samtools
    - echo $(samtools --version 2>&1) | sed 's/^.*samtools //; s/Using.*$//'
  rules:
  - bam_remove_orphans
BEDTOOLS_GENOMECOV:
  module: BEDTOOLS_GENOMECOV
  style: file
  tools:
  - - bedtools
    - bedtools --version | sed -e "s/bedtools v//g"
  rules:
  - bedtools_genomecov
BOWTIE2_ALIGN:
  module: BOWTIE2_ALIGN
  style: file
  tools:
  - - bowtie2
    - echo $(bowtie2 --version 2>&1) | sed 's/^.*bowtie2-align-s version //; s/ .*$//'
  - - samtools
    - echo $(samtools --version 2>&1) | sed 's/^.*samtools //; s/Using.*$//'
  - - pigz
    - ' pigz --version 2>&1 | sed ''s/pigz //g'' '
  rules:
  - bowtie2_align
BOWTIE2_BUILD:
  module: BOWTIE2_BUILD
  style: file
  tools:
  - - bowtie2
    - echo $(bowtie2 --version 2>&1) | sed 's/^.*bowtie2-align-s version //; s/ .*$//'
  rules:
  - bowtie2_build
BWA_INDEX:
  module: BWA_INDEX
  style: file
  tools:
  - - bwa
    - 'echo $(bwa 2>&1) | sed ''s/^.*Version: //; s/Contact:.*$//'''
  rules:
  - bwa_index
BWA_MEM:
  module: BWA_MEM
  style: file
  tools:
  - - bwa
    - 'echo $(bwa 2>&1) | sed ''s/^.*Version: //; s/Contact:.*$//'''
  - - samtools
    - echo $(samtools --version 2>&1) | sed 's/^.*samtools //; s/Using.*$//'
