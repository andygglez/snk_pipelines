  style: file
  tools:
  - - gunzip
    - echo $(gunzip --version 2>&1) | sed 's/^.*(gzip) //; s/ Copyright.*$//'
  rules:
  - gunzip
  when: str(param("blacklist")).endswith(".gz")
GUNZIP_FASTA:
