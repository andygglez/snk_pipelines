  when: str(param("gene_bed")).endswith(".gz")
GUNZIP_GFF:
  module: GUNZIP
  style: file
  tools:
  - - gunzip
    - echo $(gunzip --version 2>&1) | sed 's/^.*(gzip) //; s/ Copyright.*$//'
