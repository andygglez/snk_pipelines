  # TRIMGALORE
  trimgalore: containers/depot.galaxyproject.org-singularity-trim-galore-0.6.7--hdfd78af_0.img
  # PICARD_MERGESAMFILES, PICARD_MARKDUPLICATES, PICARD_COLLECTMULTIPLEMETRICS
  picard: containers/depot.galaxyproject.org-singularity-picard-3.2.0--hdfd78af_0.img
