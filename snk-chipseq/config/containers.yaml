# Singularity images used by each rule. Paths are relative to snk-chipseq/ (or absolute).
# Each is the image the matching nf-core/chipseq 2.1.0 module pins
# (modules/*/main.nf, https singularity URL), downloaded into containers/.
# nf-core's UMITOOLS_EXTRACT image is not listed: chipseq never runs UMI extraction.
containers:
  # SAMPLESHEET_CHECK, IGV
  python: containers/depot.galaxyproject.org-singularity-python-3.8.3.img
  # GUNZIP_*, UNTAR_*, UNTARFILES
  ubuntu22: containers/depot.galaxyproject.org-singularity-ubuntu-22.04.img
  # ANNOTATE_BOOLEAN_PEAKS, MULTIQC_CUSTOM_PEAKS, UNTARFILES (chromap .tar.gz index)
  ubuntu20: containers/depot.galaxyproject.org-singularity-ubuntu-20.04.img
  # GFFREAD
  gffread: containers/depot.galaxyproject.org-singularity-gffread-0.12.7--hdcf5f25_4.img
  # GTF2BED
  perl: containers/depot.galaxyproject.org-singularity-perl-5.26.2.img
  # CUSTOM_GETCHROMSIZES, SAMTOOLS_SORT/INDEX/STATS/FLAGSTAT/IDXSTATS
  samtools: containers/depot.galaxyproject.org-singularity-samtools-1.20--h50ea8bc_0.img
  # GENOME_BLACKLIST_REGIONS, BEDTOOLS_GENOMECOV
  bedtools: containers/depot.galaxyproject.org-singularity-bedtools-2.30.0--hc088bd4_0.img
  # BWA_INDEX
  bwa_index: containers/depot.galaxyproject.org-singularity-bwa-0.7.18--he4a0461_0.img
  # BWA_MEM (bwa + samtools)
  bwa_mem: containers/depot.galaxyproject.org-singularity-mulled-v2-fe8faa35dbf6dc65a0f7f5d4ea12e31a79f73e40-1bd8542a8a0b42e0981337910954371d0230828e-0.img
  # BOWTIE2_BUILD
