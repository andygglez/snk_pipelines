  # KHMER_UNIQUEKMERS
  khmer: containers/depot.galaxyproject.org-singularity-khmer-3.0.0a3--py37haa7609a_2.img
  # MACS3_CALLPEAK
  macs3: containers/depot.galaxyproject.org-singularity-macs3-3.0.1--py311h0152c62_3.img
  # FRIP_SCORE (bedtools + samtools)
  frip: containers/depot.galaxyproject.org-singularity-mulled-v2-8186960447c5cb2faa697666dc1e6d919ad23f3e-3127fcae6b6bdaf8181e21a26ae61231030a9fcb-0.img
  # HOMER_ANNOTATEPEAKS
  homer: containers/depot.galaxyproject.org-singularity-homer-4.11--pl526hc9558a2_3.img
  # PLOT_MACS3_QC, PLOT_HOMER_ANNOTATEPEAKS (R 4.0.3 + tidyverse + ComplexHeatmap)
  rplots: containers/depot.galaxyproject.org-singularity-mulled-v2-ad9dd5f398966bf899ae05f8e7c54d0fb10cdfa7-05678da05b8e5a7a5130e90a9f9a6c585b965afa-0.img
  # MACS3_CONSENSUS (biopython + R optparse/UpSetR + bedtools)
  consensus: containers/depot.galaxyproject.org-singularity-mulled-v2-2f48cc59b03027e31ead6d383fe1b8057785dd24-5d182f583f4696f4c4d9f3be93052811b383341f-0.img
  # SUBREAD_FEATURECOUNTS
  subread: containers/depot.galaxyproject.org-singularity-subread-2.0.1--hed695b0_0.img
  # DESEQ2_QC
  deseq2: containers/depot.galaxyproject.org-singularity-mulled-v2-8849acf39a43cdd6c839a369a74c0adc823e2f91-ab110436faf952a33575c64dd74615a84011450b-0.img
  # MULTIQC
  multiqc: containers/depot.galaxyproject.org-singularity-multiqc-1.23--pyhdfd78af_0.img

