# nf-core process -> port rules (regexes), optional `when` (Python, Snakefile names + any_wc()),
# module version-reporting style (file = versions.yml, topic = topic channel) and the
# version commands of its nf-core module. Generated from the pinned nf-core sources;
# read by the software_versions rule.
BBMAP_BBSPLIT:
  module: BBMAP_BBSPLIT
  style: topic
  tools:
  - - bbmap
    - bbversion.sh | grep -v "Duplicate cpuset"
  rules:
  - bbsplit_index
  - bbsplit_pe
  - bbsplit_se
BEDTOOLS_GENOMECOV_COMBINED:
  module: BEDTOOLS_GENOMECOV
  style: topic
  tools:
  - - bedtools
    - bedtools --version | sed -e 's/bedtools v//g'
  rules:
  - bedtools_genomecov
  when: any_wc("strand", "")
BEDTOOLS_GENOMECOV_FW:
  module: BEDTOOLS_GENOMECOV
  style: topic
  tools:
  - - bedtools
    - bedtools --version | sed -e 's/bedtools v//g'
  rules:
  - bedtools_genomecov
  when: any_wc("strand", ".forward")
BEDTOOLS_GENOMECOV_REV:
  module: BEDTOOLS_GENOMECOV
  style: topic
  tools:
  - - bedtools
    - bedtools --version | sed -e 's/bedtools v//g'
  rules:
  - bedtools_genomecov
  when: any_wc("strand", ".reverse")
BOWTIE2_ALIGN:
  module: BOWTIE2_ALIGN
  style: topic
  tools:
  - - bowtie2
    - bowtie2 --version 2>&1 | sed -n 's/.*bowtie2-align-s version //p'
  - - samtools
    - samtools version | sed '1!d;s/.* //'
  - - pigz
    - pigz --version 2>&1 | sed 's/pigz //'
  rules:
  - bowtie2_rrna_se
  - bowtie2_align_.*
BOWTIE2_ALIGN_PE:
  module: BOWTIE2_ALIGN
  style: topic
  tools:
  - - bowtie2
    - bowtie2 --version 2>&1 | sed -n 's/.*bowtie2-align-s version //p'
  - - samtools
    - samtools version | sed '1!d;s/.* //'
  - - pigz
    - pigz --version 2>&1 | sed 's/pigz //'
  rules:
  - bowtie2_rrna_pe
BOWTIE2_BUILD:
  module: BOWTIE2_BUILD
  style: topic
  tools:
  - - bowtie2
    - bowtie2 --version 2>&1 | sed -n 's/.*bowtie2-align-s version //p'
  rules:
  - bowtie2_build_transcripts
  - bowtie2_build_rrna
BRACKEN:
  module: BRACKEN_BRACKEN
  style: topic
  tools:
  - - bracken
    - bracken -v | cut -f2 -d"v"
  rules:
  - bracken
CAT_FASTQ:
  module: CAT_FASTQ
  style: topic
  tools:
  - - cat
    - cat --version 2>&1 | head -n 1 | sed 's/^.*coreutils) //; s/ .*$//'
  rules:
  - cat_fastq_se
  - cat_fastq_pe
CUSTOM_CATADDITIONALFASTA:
  module: CUSTOM_CATADDITIONALFASTA
  style: topic
  tools:
  - - python
    - python3 -c 'import platform; print(platform.python_version())'
  rules:
  - custom_catadditionalfasta
CUSTOM_GTFFILTER:
